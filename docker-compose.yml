version: '3.8'

services:
  nova-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nova-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - MONGODB_URL=mongodb://nova-mongodb:27017/nova_x
      - REDIS_URL=redis://nova-redis:6379/0
      - VECTOR_DB_URL=http://nova-vector:6333
      - USE_IN_MEMORY_FALLBACK=false
    depends_on:
      - nova-mongodb
      - nova-redis
    volumes:
      - ./data/storage:/app/data/storage

  nova-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nova-web
    ports:
      - "5173:80"
    depends_on:
      - nova-api

  nova-mongodb:
    image: mongo:7.0
    container_name: nova-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  nova-redis:
    image: redis:7.2-alpine
    container_name: nova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nova-vector:
    image: qdrant/qdrant:latest
    container_name: nova-vector
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:
